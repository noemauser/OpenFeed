name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate seed packs
        run: |
          export PYTHONPATH=src
          for f in packs/kp_*.json; do
            python -m openfeed validate "$f"
          done
      - name: Pytest
        run: pytest -q
      - name: Rebuild index (dry)
        run: |
          export PYTHONPATH=src
          python -m openfeed index --packs-dir packs -o /tmp/openfeed-index.json
