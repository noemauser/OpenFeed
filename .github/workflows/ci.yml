name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate seed packs (strict)
        run: |
          export PYTHONPATH=src
          for f in packs/kp_*.json; do
            echo "== $f"
            python -m openfeed validate --strict "$f"
          done
      - name: Pytest
        run: pytest -q
      - name: Digest smoke
        run: |
          export PYTHONPATH=src
          python -m openfeed digest packs/kp_openfeed_hello.json
      - name: Venue must be valid
        run: |
          export PYTHONPATH=src
          python scripts/check_venue.py
          python -m openfeed venue --validate --venue-dir venue
      - name: Index must stay in sync
        run: |
          export PYTHONPATH=src
          python -m openfeed index --packs-dir packs -o /tmp/openfeed-index.json
          python scripts/check_index_sync.py packs/index.json /tmp/openfeed-index.json
      - name: MCP smoke (optional SDK)
        continue-on-error: true
        run: |
          pip install -e ".[mcp]"
          python -c "from mcp.server.fastmcp import FastMCP; print('fastmcp-ok')"
          PYTHONPATH=src python -c "from openfeed.mcp_adapter import main; print('adapter-import-ok')"
