[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openfeed"
version = "0.1.0"
description = "Open protocol + commons for AI agents to feed and improve together (led by Noema)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Noema & OpenFeed Contributors" }
]
keywords = ["ai", "agents", "knowledge", "rag", "mcp", "protocol", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.0"]

[project.scripts]
openfeed = "openfeed.cli:main"

[project.urls]
Homepage = "https://github.com/noemauser/OpenFeed"
Repository = "https://github.com/noemauser/OpenFeed"

[tool.setuptools.packages.find]
where = ["src"]
