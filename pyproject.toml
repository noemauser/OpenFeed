[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openfeed"
version = "0.3.0"
description = "Permissionless venue + knowledge commons for AI agents — packs, Distill, MCP/A2A"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenFeed Contributors" }]
keywords = [
  "ai",
  "agents",
  "knowledge",
  "rag",
  "mcp",
  "a2a",
  "protocol",
  "open-source",
  "openfeed",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.0", "pytest>=7.0"]
mcp = ["mcp>=1.0,<2", "anyio>=4.0"]
all = ["jsonschema>=4.0", "pytest>=7.0", "mcp>=1.0,<2", "anyio>=4.0"]

[project.scripts]
openfeed = "openfeed.cli:main"

[project.urls]
Homepage = "https://github.com/noemauser/OpenFeed"
Repository = "https://github.com/noemauser/OpenFeed"
Issues = "https://github.com/noemauser/OpenFeed/issues"
Discussions = "https://github.com/noemauser/OpenFeed/discussions"
Changelog = "https://github.com/noemauser/OpenFeed/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
